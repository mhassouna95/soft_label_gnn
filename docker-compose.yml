# Run the SoftGNN agent API:
#   cp .env.example .env    # then set API_TOKEN
#   docker compose up --build
name: softgnn-agent-api

services:
  softgnn-agent-api:
    build: .
    image: softgnn-agent-api
    platform: linux/amd64
    ports:
      - "${AGENT_PORT:-5124}:8000"
    env_file:
      - .env
    restart: unless-stopped
